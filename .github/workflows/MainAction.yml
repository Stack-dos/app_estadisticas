name: MainAction

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, develop]

# Permisos minimos del GITHUB_TOKEN: los jobs solo pueden LEER el repositorio.
# Si un job necesita mas (ver "gitleaks"), lo declara el mismo.
permissions:
  contents: read

# Una sola corrida por PR (o por rama): si llega un push nuevo, se cancela la anterior.
# Solo se cancela en Pull Requests: en main/develop se deja terminar cada corrida
# para tener el resultado de cada commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check_dep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Exportar dependencias fijadas (uv.lock) a un archivo de requisitos
        run: uv export --locked --no-emit-project --no-hashes -o requirements-audit.txt

      - name: Run pip-audit check
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements-audit.txt

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Este job pide un permiso extra (leer PRs) para saber que commits escanear.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository (historial completo)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Buscar secretos con gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Comentar en el PR requeriria permiso de escritura: el resultado queda en el resumen del job
          GITLEAKS_ENABLE_COMMENTS: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run style check
        uses: ./.github/actions/style/ruff

  # mypy corre una sola vez, contra la version de Python mas vieja que se prueba en "tests-linux":
  # si el codigo usa algo que esa version no tiene, lo marca.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run static check
        uses: ./.github/actions/style/mypy
        with:
          python-version: "3.12"

  # Unico job con matriz de versiones de Python: Docker y Windows corren una sola vez (3.13).
  tests-linux:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests and coverage on Linux
        uses: ./.github/actions/coverage/linux
        with:
          python-version: ${{ matrix.python-version }}

  tests-docker:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests inside Docker
        uses: ./.github/actions/coverage/docker
        with:
          python-version: "3.13"

  # Windows corre con una sola version (3.13, sin matriz): alcanza para detectar problemas propios del
  # sistema operativo (rutas, saltos de linea, SQLite). Las demas versiones de Python se prueban en Linux.
  tests-windows:
    runs-on: windows-latest
    needs: lint
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run tests and coverage on Windows
        uses: ./.github/actions/coverage/windows
        with:
          python-version: "3.13"

  # Job agregador: es el UNICO que hay que marcar como "required status check" en GitHub
  # (Settings > Branches). Depende de todos los demas y falla si alguno fallo, se cancelo o se salteo
  # (ej. si falla "lint", los tests se saltean: eso tambien cuenta como rojo).
  # always(): corre aunque un job anterior falle; sin esto se saltearia y GitHub lo tomaria como aprobado.
  ci-ok:
    if: ${{ always() }}
    needs: [check_dep, gitleaks, lint, static, tests-linux, tests-docker, tests-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verificar que todos los jobs terminaron bien
        env:
          RESULTADOS: ${{ toJSON(needs) }}
          HAY_ROJO: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "$RESULTADOS"
          if [ "$HAY_ROJO" = "true" ]; then
            echo "::error::Al menos un job del CI no termino en verde"
            exit 1
          fi
