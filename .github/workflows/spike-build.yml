name: SpikeBuild

# TEMPORAL (US-109, paso 7): prueba "flet build" en los runners de GitHub y sube la carpeta resultante como
# artifact para probarla a mano. Se borra cuando exista release.yml (paso 9), que hace lo mismo con el tag.
on:
  workflow_dispatch:
  push:
    branches: [feature/us109]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plataforma: windows
          - os: ubuntu-latest
            plataforma: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Instalar uv y Python
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true

      # Lo que pide Flutter para compilar en Linux (Windows ya trae Visual Studio con C++)
      - name: Dependencias de sistema (Linux)
        if: matrix.plataforma == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      # --yes: si no hay Flutter, flet lo baja solo (la version que esa flet-cli necesita)
      - name: flet build ${{ matrix.plataforma }}
        shell: bash
        env:
          # En Windows la consola de Python usa cp1252 y flet-cli explota al reenviar el "√" con el que Flutter
          # avisa que termino (UnicodeEncodeError). Modo UTF-8 de Python: stdout en UTF-8. En Linux no cambia nada.
          PYTHONUTF8: "1"
        run: uv run --locked --no-dev --with flet-cli==1.1.2 flet build "${{ matrix.plataforma }}" --yes --no-rich-output --verbose

      # Sin "| head": con pipefail (el bash de Actions lo usa), el "Broken pipe" de ls hace fallar el paso
      - name: Contenido del build
        shell: bash
        run: |
          find "build/${{ matrix.plataforma }}" -maxdepth 2 | sort
          echo "--- scripts SQL (sin estos la app no arranca) ---"
          find "build/${{ matrix.plataforma }}" -name "*.sql"
          du -sh "build/${{ matrix.plataforma }}"

      - name: Subir la carpeta como artifact
        uses: actions/upload-artifact@v7
        with:
          name: statspro-${{ matrix.plataforma }}
          path: build/${{ matrix.plataforma }}
          retention-days: 7
