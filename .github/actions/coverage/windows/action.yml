name: "Test Windows"
description: "Corre tests y coverage en Windows"

inputs:
  python-version:
    description: "Version de Python con la que se corren los tests (ej. 3.12)"
    required: false
    default: "3.11"

runs:
  using: "composite"
  steps:
    - name: Instalar uv y Python ${{ inputs.python-version }}
      uses: astral-sh/setup-uv@v10.1.0
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true

    - name: Instalar dependencias
      shell: pwsh
      run: uv sync --locked

    # Smoke test: si un import esta roto, la CLI ni siquiera muestra la ayuda y el job falla aca.
    - name: Probar que la CLI arranca
      shell: pwsh
      run: |
        uv run --locked python src/main.py --help

    - name: Ejecutar pytest con coverage
      shell: pwsh
      run: |
        uv run --locked pytest -v --cov=src --cov-report=html
