[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statspro-basketball"
version = "0.1.0"
description = "Aplicación de estadísticas de básquet, ejecución local (offline-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "tabulate==0.10.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pre-commit>=4.6.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E501", "I"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
explicit_package_bases = true

# tabulate no publica stubs de tipos: sin esto, mypy --strict falla al importarla
[[tool.mypy.overrides]]
module = "tabulate.*"
ignore_missing_imports = true
