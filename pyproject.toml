[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "statspro-basketball"
version = "0.1.0"
description = "Aplicación de estadísticas de básquet, ejecución local (offline-first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "tabulate==0.10.0",
]

# Comando "statspro" al instalar el paquete (por ahora: uv tool install --editable .)
[project.scripts]
statspro = "main:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pre-commit>=4.6.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.ruff]
line-length = 120
# docs/ son guias en Markdown: ruff no las revisa ni las formatea
extend-exclude = ["docs"]

[tool.ruff.lint]
# Unica fuente de reglas: el CI, pre-commit y el Makefile corren "ruff check" sin --select.
# E/W: estilo (pycodestyle) · F: errores reales (pyflakes) · I: orden de imports · B: bugs comunes (bugbear)
# UP: sintaxis moderna de Python · SIM: simplificaciones · C4: comprensiones · RUF: reglas propias de ruff
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 72

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
explicit_package_bases = true

# tabulate no publica stubs de tipos: sin esto, mypy --strict falla al importarla
[[tool.mypy.overrides]]
module = "tabulate.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
# pythonpath = src: los tests importan dominio, aplicacion... directo
pythonpath = ["src"]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

[tool.coverage.run]
source = ["src/"]
branch = true
omit = [
    "tests/*",
    "venv/*",
    "setup.py",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
# Piso base (local, Windows y Docker). El job de Linux del CI exige mas: ver
# "cobertura-minima" en .github/actions/coverage/linux/action.yml
fail_under = 60
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "reportes_cobertura/html/"
